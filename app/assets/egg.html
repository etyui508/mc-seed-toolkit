<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千万别点 / Told you not to click</title>
<style>
  html, body { margin:0; height:100%; background:#0b0d11; color:#8b93a3;
               font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:14px; }
  video { width:min(92vw, 900px); max-height:72vh; border-radius:12px;
          background:#000; box-shadow:0 18px 50px #000a; }
  p { margin:0; }
  a { color:#6ea8fe; }
</style>
<body>
<video src="egg.mp4" controls autoplay playsinline></video>
<p>都说了千万别点。<span class="en"> Told you not to click.</span>
   <a href="#" id="close">关掉这个窗口 / Close this window</a></p>
<script>
  var v = document.querySelector("video");
  // 浏览器默认拦"带声音的自动播放"：先按有声放，不放就静音再放一次，
  // 屏幕上还有原生控件，最差也就是用户自己点一下播放。
  v.volume = 0.7;
  v.play().catch(function () { v.muted = true; v.play().catch(function () {}); });
  document.getElementById("close").addEventListener("click", function (e) {
    e.preventDefault();
    window.close();
  });
</script>
</body>
</html>
